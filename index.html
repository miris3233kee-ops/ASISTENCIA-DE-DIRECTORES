<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LECTOR DE ASISTENCIA QR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --success: #2e7d32;
            --error: #c62828;
            --warning: #f9a825;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a237e;
            --text-secondary: #546e7a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f5f5f5 100%);
            min-height: 100vh;
            padding: 12px;
            color: var(--text);
        }

        .contenedor {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(21, 101, 192, 0.15);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 22px 20px 18px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .subtitulo {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 400;
        }

        .contador {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Cuerpo */
        .body {
            padding: 18px 18px 24px;
        }

        /* Botones de cámara */
        .botones-camara {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 13px 14px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        #botonCamara {
            flex: 1;
            min-width: 140px;
            background: var(--primary);
            color: white;
        }

        #botonCamara:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn-secundario {
            background: #eceff1;
            color: #37474f;
            width: 48px;
            padding: 13px 0;
            display: none;
        }

        .btn-secundario.visible {
            display: flex;
        }

        .btn-secundario.activo {
            background: #ffecb3;
            color: #f57f17;
        }

        /* Contenedor del lector */
        .lector-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #111;
            min-height: 0;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            border-radius: 16px !important;
            display: block;
        }

        /* Indicador de escaneo */
        .scan-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        .scan-overlay.visible {
            display: block;
        }

        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 260px;
            aspect-ratio: 1;
            border: 3px solid rgba(255,255,255,0.85);
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
        }

        .scan-line {
            position: absolute;
            left: 8%;
            right: 8%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4caf50, transparent);
            border-radius: 2px;
            animation: scanMove 2.2s ease-in-out infinite;
        }

        @keyframes scanMove {
            0%   { top: 12%; opacity: 0.4; }
            50%  { top: 85%; opacity: 1; }
            100% { top: 12%; opacity: 0.4; }
        }

        /* Resultado */
        #resultado {
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        #resultado.aviso {
            background: #fff8e1;
            color: #f57f17;
            border: 1px solid #ffe082;
        }

        #resultado.ok {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            animation: pulseSuccess 0.5s ease;
        }

        #resultado.error {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
            animation: shake 0.4s ease;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .estado {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .nombre {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .hora {
            font-size: 1.05rem;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* Entrada manual */
        .seccion-manual {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px dashed #cfd8dc;
        }

        .seccion-manual label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-grupo {
            display: flex;
            gap: 8px;
        }

        .input-grupo input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-grupo input:focus {
            border-color: var(--primary);
        }

        .input-grupo button {
            background: var(--primary);
            color: white;
            padding: 0 18px;
            font-size: 0.9rem;
        }

        /* Historial */
        .historial {
            margin-top: 8px;
        }

        .historial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .historial h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .historial-info {
            font-size: 0.75rem;
            color: #90a4ae;
        }

        .historial-lista {
            max-height: 220px;
            overflow-y: auto;
            border-radius: 12px;
            background: #fafafa;
        }

        .item-historial {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .item-historial:last-child {
            border-bottom: none;
        }

        .item-historial .nombre-hist {
            font-weight: 600;
            color: var(--text);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 8px;
        }

        .item-historial .hora-hist {
            color: var(--text-secondary);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .item-historial.ok-hist {
            border-left: 4px solid var(--success);
        }

        .item-historial.ya-hist {
            border-left: 4px solid var(--warning);
        }

        .vacio {
            text-align: center;
            padding: 20px;
            color: #90a4ae;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.75rem;
            color: #90a4ae;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <div class="header">
        <div class="contador" id="contadorHoy">Hoy: 0</div>
        <h1>📱 LECTOR QR</h1>
        <div class="subtitulo">Control de Asistencia</div>
    </div>

    <div class="body">

        <!-- BOTONES CÁMARA MEJORADOS -->
        <div class="botones-camara">
            <button id="botonCamara" onclick="iniciarCamara()">
                📷 ACTIVAR CÁMARA
            </button>
            <button id="botonDetener" class="btn-secundario" onclick="detenerCamara()" title="Detener cámara">
                ⏹️
            </button>
            <button id="botonCambiar" class="btn-secundario" onclick="cambiarCamara()" title="Cambiar cámara">
                🔄
            </button>
            <button id="botonLinterna" class="btn-secundario" onclick="toggleLinterna()" title="Linterna">
                🔦
            </button>
        </div>

        <!-- LECTOR CON OVERLAY -->
        <div class="lector-wrapper">
            <div id="reader"></div>
            <div class="scan-overlay" id="scanOverlay">
                <div class="scan-frame">
                    <div class="scan-line"></div>
                </div>
            </div>
        </div>

        <!-- RESULTADO -->
        <div id="resultado" class="aviso">
            <div class="estado">PRESIONE "ACTIVAR CÁMARA"</div>
        </div>

        <!-- ENTRADA MANUAL -->
        <div class="seccion-manual">
            <label>✍️ Ingreso manual de C.I.</label>
            <div class="input-grupo">
                <input type="text" id="inputCI" placeholder="Ej: 1234567" inputmode="numeric" maxlength="15">
                <button onclick="enviarManual()">ENVIAR</button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="historial">
            <div class="historial-header">
                <h3>📋 Últimos registros</h3>
                <span class="historial-info" id="infoRetencion">Guarda 3 meses</span>
            </div>
            <div class="historial-lista" id="historialLista">
                <div class="vacio">Aún no hay registros</div>
            </div>
        </div>

    </div>

    <div class="footer">
        Sistema de Asistencia · Datos guardados 90 días
    </div>

</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyX1EK2U9WpxPHuDYZigJXWgSo31V2txxVl5Xd3t6XqC6J3W0xuxWugo8MHF0Dly_JaKw/exec";

const DIAS_RETENCION = 90;
const MAX_REGISTROS = 800;

let lector = null;
let procesando = false;
let camaraActiva = false;
let historial = [];
let contadorHoy = 0;

// Variables de cámara mejoradas
let camarasDisponibles = [];
let indiceCamaraActual = 0;
let linternaEncendida = false;
let videoTrack = null;

// ============================================================
// INICIALIZACIÓN
// ============================================================
function inicializarDatos() {
    try {
        const guardado = localStorage.getItem('historialAsistencia');
        if (guardado) historial = JSON.parse(guardado);

        const limiteMs = DIAS_RETENCION * 24 * 60 * 60 * 1000;
        const ahora = Date.now();
        const antes = historial.length;

        historial = historial.filter(item => item.ts && (ahora - item.ts) < limiteMs);
        if (historial.length > MAX_REGISTROS) historial = historial.slice(0, MAX_REGISTROS);

        if (historial.length !== antes) {
            localStorage.setItem('historialAsistencia', JSON.stringify(historial));
        }

        actualizarHistorialUI();

        const cont = localStorage.getItem('contadorHoy');
        const fecha = localStorage.getItem('fechaContador');
        const hoy = new Date().toDateString();

        if (fecha === hoy && cont) {
            contadorHoy = parseInt(cont) || 0;
        } else {
            contadorHoy = 0;
            localStorage.setItem('fechaContador', hoy);
            localStorage.setItem('contadorHoy', '0');
        }

        document.getElementById('contadorHoy').textContent = `Hoy: ${contadorHoy}`;
        document.getElementById('infoRetencion').textContent =
            historial.length > 0 ? `${historial.length} registros · 90 días` : 'Guarda 3 meses';

    } catch (e) {
        console.error(e);
        historial = [];
    }
}

inicializarDatos();

// ============================================================
// CÁMARA MEJORADA
// ============================================================
async function obtenerCamaras() {
    try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
            // Preferir cámara trasera (environment)
            camarasDisponibles = devices;
            // Buscar la trasera primero
            const trasera = devices.findIndex(d =>
                /back|rear|environment|trasera|posterior/i.test(d.label)
            );
            indiceCamaraActual = trasera >= 0 ? trasera : 0;
            return true;
        }
    } catch (e) {
        console.warn('No se pudieron listar cámaras:', e);
    }
    return false;
}

async function iniciarCamara() {
    const boton = document.getElementById("botonCamara");
    boton.disabled = true;
    boton.innerHTML = "⏳ ACTIVANDO...";

    try {
        // Pedir permiso primero
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
        });
        stream.getTracks().forEach(t => t.stop());

        // Obtener lista de cámaras
        await obtenerCamaras();

        lector = new Html5Qrcode("reader");

        const config = {
            fps: 15,
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Área de escaneo adaptativa (70% del menor lado)
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                const size = Math.floor(minEdge * 0.72);
                return { width: size, height: size };
            },
            aspectRatio: 1.0,
            disableFlip: false
        };

        // Iniciar con cámara específica si hay lista, sino con facingMode
        if (camarasDisponibles.length > 0) {
            const camId = camarasDisponibles[indiceCamaraActual].id;
            await lector.start(camId, config, onScanSuccess, onScanFailure);
        } else {
            await lector.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            );
        }

        camaraActiva = true;
        boton.innerHTML = "🟢 CÁMARA ACTIVA";
        mostrarBotonesSecundarios(true);
        document.getElementById("scanOverlay").classList.add("visible");

        // Guardar referencia del track para la linterna
        setTimeout(capturarVideoTrack, 600);

        mostrarMensaje("AVISO", "ESCANEE EL CÓDIGO QR", "", "");

    } catch (err) {
        console.error(err);
        boton.disabled = false;
        boton.innerHTML = "📷 ACTIVAR CÁMARA";
        mostrarBotonesSecundarios(false);

        let mensaje = "NO SE PUDO ACTIVAR LA CÁMARA";
        if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            mensaje = "PERMISO DE CÁMARA DENEGADO";
        } else if (err.name === "NotFoundError") {
            mensaje = "NO SE ENCONTRÓ CÁMARA";
        } else if (err.name === "NotReadableError") {
            mensaje = "CÁMARA EN USO POR OTRA APP";
        }

        mostrarMensaje("ERROR", mensaje, "", "");
        hablar(mensaje.toLowerCase());
    }
}

function onScanSuccess(codigo) {
    procesarQR(codigo);
}

function onScanFailure() {
    // Silenciar errores normales de lectura continua
}

function capturarVideoTrack() {
    try {
        const video = document.querySelector("#reader video");
        if (video && video.srcObject) {
            const tracks = video.srcObject.getVideoTracks();
            if (tracks.length) {
                videoTrack = tracks[0];
            }
        }
    } catch (e) {}
}

async function detenerCamara() {
    linternaEncendida = false;
    actualizarBotonLinterna();

    if (lector && camaraActiva) {
        try {
            await lector.stop();
            lector.clear();
        } catch (e) {}
        camaraActiva = false;
        lector = null;
        videoTrack = null;
    }

    document.getElementById("botonCamara").disabled = false;
    document.getElementById("botonCamara").innerHTML = "📷 ACTIVAR CÁMARA";
    mostrarBotonesSecundarios(false);
    document.getElementById("scanOverlay").classList.remove("visible");
    document.getElementById("reader").innerHTML = "";

    mostrarMensaje("AVISO", "CÁMARA DETENIDA", "", "");
}

async function cambiarCamara() {
    if (!camaraActiva || camarasDisponibles.length < 2) {
        mostrarMensaje("AVISO", "SOLO HAY UNA CÁMARA", "", "");
        return;
    }

    // Cambiar índice
    indiceCamaraActual = (indiceCamaraActual + 1) % camarasDisponibles.length;

    // Apagar linterna al cambiar
    linternaEncendida = false;
    actualizarBotonLinterna();

    try {
        await lector.stop();
        const camId = camarasDisponibles[indiceCamaraActual].id;

        const config = {
            fps: 15,
            qrbox: function(w, h) {
                const minEdge = Math.min(w, h);
                const size = Math.floor(minEdge * 0.72);
                return { width: size, height: size };
            },
            aspectRatio: 1.0
        };

        await lector.start(camId, config, onScanSuccess, onScanFailure);
        setTimeout(capturarVideoTrack, 500);

        const nombre = camarasDisponibles[indiceCamaraActual].label || `Cámara ${indiceCamaraActual + 1}`;
        mostrarMensaje("AVISO", "CÁMARA CAMBIADA", nombre.substring(0, 30), "");

    } catch (e) {
        console.error(e);
        mostrarMensaje("ERROR", "NO SE PUDO CAMBIAR DE CÁMARA", "", "");
        // Intentar volver a la anterior
        await iniciarCamara();
    }
}

async function toggleLinterna() {
    if (!camaraActiva || !videoTrack) {
        capturarVideoTrack();
        if (!videoTrack) {
            mostrarMensaje("AVISO", "LINTERNA NO DISPONIBLE", "", "");
            return;
        }
    }

    try {
        const capabilities = videoTrack.getCapabilities?.() || {};
        if (!capabilities.torch) {
            mostrarMensaje("AVISO", "ESTE DISPOSITIVO NO TIENE LINTERNA", "", "");
            return;
        }

        linternaEncendida = !linternaEncendida;
        await videoTrack.applyConstraints({
            advanced: [{ torch: linternaEncendida }]
        });

        actualizarBotonLinterna();
        mostrarMensaje("AVISO", linternaEncendida ? "🔦 LINTERNA ENCENDIDA" : "LINTERNA APAGADA", "", "");

    } catch (e) {
        console.error(e);
        linternaEncendida = false;
        actualizarBotonLinterna();
        mostrarMensaje("AVISO", "NO SE PUDO CONTROLAR LA LINTERNA", "", "");
    }
}

function actualizarBotonLinterna() {
    const btn = document.getElementById("botonLinterna");
    if (linternaEncendida) {
        btn.classList.add("activo");
        btn.innerHTML = "💡";
    } else {
        btn.classList.remove("activo");
        btn.innerHTML = "🔦";
    }
}

function mostrarBotonesSecundarios(mostrar) {
    const ids = ["botonDetener", "botonCambiar", "botonLinterna"];
    ids.forEach(id => {
        const el = document.getElementById(id);
        if (mostrar) el.classList.add("visible");
        else el.classList.remove("visible");
    });
}

// ============================================================
// PROCESAR QR / MANUAL
// ============================================================
function procesarQR(codigo) {
    if (procesando) return;

    const ci = String(codigo).trim();
    if (!ci) return;

    procesando = true;

    if (lector && camaraActiva) {
        try { lector.pause(true); } catch (e) {}
    }

    mostrarMensaje("AVISO", "🔎 VERIFICANDO...", "", "");
    enviarCI(ci);
}

function enviarManual() {
    const input = document.getElementById("inputCI");
    const ci = input.value.trim();

    if (!ci) {
        mostrarMensaje("ERROR", "INGRESE UN NÚMERO DE C.I.", "", "");
        return;
    }
    if (procesando) return;

    procesando = true;
    input.value = "";
    mostrarMensaje("AVISO", "🔎 VERIFICANDO...", "", "");
    enviarCI(ci);
}

document.getElementById("inputCI").addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviarManual();
});

// ============================================================
// ENVIAR A APPS SCRIPT
// ============================================================
function enviarCI(ci) {
    const callbackName = "respuestaQR_" + Date.now();

    window[callbackName] = function(respuesta) {
        try {
            mostrarResultado(respuesta, ci);
        } finally {
            delete window[callbackName];
            setTimeout(() => {
                procesando = false;
                if (lector && camaraActiva) {
                    try { lector.resume(); } catch (e) {}
                }
            }, 2800);
        }
    };

    const script = document.createElement("script");
    script.src = URL_APPS_SCRIPT +
        "?ci=" + encodeURIComponent(ci) +
        "&callback=" + callbackName;

    script.onerror = function() {
        mostrarMensaje("ERROR", "❌ ERROR DE CONEXIÓN", "", "");
        hablar("Error de conexión con el sistema");
        delete window[callbackName];
        setTimeout(() => {
            procesando = false;
            if (lector && camaraActiva) {
                try { lector.resume(); } catch (e) {}
            }
        }, 2800);
    };

    document.body.appendChild(script);
}

// ============================================================
// RESULTADOS
// ============================================================
function mostrarResultado(respuesta, ci) {
    if (!respuesta) {
        mostrarMensaje("ERROR", "SIN RESPUESTA DEL SISTEMA", "", "");
        hablar("Sin respuesta del sistema");
        return;
    }

    if (respuesta.estado === "OK") {
        mostrarMensaje("OK", "✅ ASISTENCIA REGISTRADA", respuesta.nombre, respuesta.hora);
        hablar("Asistencia registrada. " + (respuesta.nombre || ""));
        vibrar(true);
        agregarHistorial(respuesta.nombre || ci, respuesta.hora || "", "ok");
        incrementarContador();
        return;
    }

    if (respuesta.estado === "YA") {
        mostrarMensaje("AVISO", "⚠️ YA REGISTRADA HOY", respuesta.nombre, "");
        hablar("Asistencia ya registrada. " + (respuesta.nombre || ""));
        vibrar(false);
        agregarHistorial(respuesta.nombre || ci, "Ya registrada", "ya");
        return;
    }

    if (respuesta.estado === "FUERA") {
        mostrarMensaje("AVISO", "⏰ FUERA DEL HORARIO", respuesta.nombre, "");
        hablar("Fuera del horario. " + (respuesta.nombre || ""));
        return;
    }

    const msg = respuesta.mensaje || "ERROR DESCONOCIDO";
    mostrarMensaje("ERROR", "❌ " + msg, "", "");
    hablar(msg);
}

function mostrarMensaje(tipo, mensaje, nombre, hora) {
    const el = document.getElementById("resultado");
    el.className = "";
    el.classList.add(tipo === "OK" ? "ok" : tipo === "ERROR" ? "error" : "aviso");

    let html = `<div class="estado">${mensaje}</div>`;
    if (nombre) html += `<div class="nombre">${nombre}</div>`;
    if (hora) html += `<div class="hora">🕐 ${hora}</div>`;
    el.innerHTML = html;
}

// ============================================================
// HISTORIAL
// ============================================================
function agregarHistorial(nombre, hora, tipo) {
    const ahora = Date.now();
    historial.unshift({ nombre, hora, tipo, ts: ahora });

    const limiteMs = DIAS_RETENCION * 24 * 60 * 60 * 1000;
    historial = historial.filter(item => (ahora - item.ts) < limiteMs);
    if (historial.length > MAX_REGISTROS) historial = historial.slice(0, MAX_REGISTROS);

    try {
        localStorage.setItem('historialAsistencia', JSON.stringify(historial));
    } catch (e) {
        historial = historial.slice(0, Math.floor(historial.length * 0.7));
        try { localStorage.setItem('historialAsistencia', JSON.stringify(historial)); } catch (e2) {}
    }

    actualizarHistorialUI();
}

function actualizarHistorialUI() {
    const lista = document.getElementById("historialLista");
    const info = document.getElementById("infoRetencion");

    if (historial.length === 0) {
        lista.innerHTML = '<div class="vacio">Aún no hay registros</div>';
        info.textContent = 'Guarda 3 meses';
        return;
    }

    const mostrar = historial.slice(0, 25);
    lista.innerHTML = mostrar.map(item => {
        const fecha = new Date(item.ts);
        const esHoy = fecha.toDateString() === new Date().toDateString();
        const textoHora = esHoy
            ? item.hora
            : fecha.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + (item.hora || '');

        return `
            <div class="item-historial ${item.tipo === 'ok' ? 'ok-hist' : 'ya-hist'}">
                <span class="nombre-hist">${item.nombre}</span>
                <span class="hora-hist">${textoHora}</span>
            </div>
        `;
    }).join('');

    info.textContent = `${historial.length} registros · 90 días`;
}

function incrementarContador() {
    contadorHoy++;
    document.getElementById('contadorHoy').textContent = `Hoy: ${contadorHoy}`;
    try {
        localStorage.setItem('contadorHoy', contadorHoy.toString());
        localStorage.setItem('fechaContador', new Date().toDateString());
    } catch (e) {}
}

// ============================================================
// UTILIDADES
// ============================================================
function hablar(texto) {
    try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = "es-ES";
        voz.rate = 0.95;
        voz.pitch = 1;
        window.speechSynthesis.speak(voz);
    } catch (e) {}
}

function vibrar(exito) {
    if ("vibrate" in navigator) {
        navigator.vibrate(exito ? [80, 40, 80] : [150]);
    }
}
