<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LECTOR DE ASISTENCIA QR</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --success: #2e7d32;
            --error: #c62828;
            --warning: #f9a825;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a237e;
            --text-secondary: #546e7a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f5f5f5 100%);
            min-height: 100vh;
            padding: 12px;
            color: var(--text);
        }

        .contenedor {
            max-width: 480px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(21, 101, 192, 0.15);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 22px 20px 18px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .subtitulo {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 400;
        }

        .contador {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Cuerpo */
        .body {
            padding: 18px 18px 24px;
        }

        /* Botones de cámara */
        .botones-camara {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #botonCamara {
            flex: 1;
            background: var(--primary);
            color: white;
        }

        #botonCamara:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        #botonDetener {
            background: #eceff1;
            color: #455a64;
            width: 52px;
            display: none;
        }

        #botonDetener.visible {
            display: flex;
        }

        /* Lector QR */
        #reader {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #000;
            min-height: 0;
        }

        #reader video {
            border-radius: 14px !important;
        }

        /* Resultado */
        #resultado {
            border-radius: 14px;
            padding: 18px 16px;
            text-align: center;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        #resultado.aviso {
            background: #fff8e1;
            color: #f57f17;
            border: 1px solid #ffe082;
        }

        #resultado.ok {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #a5d6a7;
            animation: pulseSuccess 0.5s ease;
        }

        #resultado.error {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ef9a9a;
            animation: shake 0.4s ease;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .estado {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .nombre {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .hora {
            font-size: 1.05rem;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* Entrada manual */
        .seccion-manual {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px dashed #cfd8dc;
        }

        .seccion-manual label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-grupo {
            display: flex;
            gap: 8px;
        }

        .input-grupo input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-grupo input:focus {
            border-color: var(--primary);
        }

        .input-grupo button {
            background: var(--primary);
            color: white;
            padding: 0 18px;
            font-size: 0.9rem;
        }

        /* Historial */
        .historial {
            margin-top: 8px;
        }

        .historial-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .historial h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .historial-info {
            font-size: 0.75rem;
            color: #90a4ae;
        }

        .historial-lista {
            max-height: 220px;
            overflow-y: auto;
            border-radius: 12px;
            background: #fafafa;
        }

        .item-historial {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .item-historial:last-child {
            border-bottom: none;
        }

        .item-historial .nombre-hist {
            font-weight: 600;
            color: var(--text);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 8px;
        }

        .item-historial .hora-hist {
            color: var(--text-secondary);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .item-historial.ok-hist {
            border-left: 4px solid var(--success);
        }

        .item-historial.ya-hist {
            border-left: 4px solid var(--warning);
        }

        .vacio {
            text-align: center;
            padding: 20px;
            color: #90a4ae;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.75rem;
            color: #90a4ae;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <!-- HEADER -->
    <div class="header">
        <div class="contador" id="contadorHoy">Hoy: 0</div>
        <h1>📱 LECTOR QR</h1>
        <div class="subtitulo">Control de Asistencia</div>
    </div>

    <div class="body">

        <!-- BOTONES CÁMARA -->
        <div class="botones-camara">
            <button id="botonCamara" onclick="iniciarCamara()">
                📷 ACTIVAR CÁMARA
            </button>
            <button id="botonDetener" onclick="detenerCamara()" title="Detener cámara">
                ⏹️
            </button>
        </div>

        <!-- LECTOR -->
        <div id="reader"></div>

        <!-- RESULTADO -->
        <div id="resultado" class="aviso">
            <div class="estado">PRESIONE "ACTIVAR CÁMARA"</div>
        </div>

        <!-- ENTRADA MANUAL -->
        <div class="seccion-manual">
            <label>✍️ Ingreso manual de C.I.</label>
            <div class="input-grupo">
                <input type="text" id="inputCI" placeholder="Ej: 1234567" inputmode="numeric" maxlength="15">
                <button onclick="enviarManual()">ENVIAR</button>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="historial">
            <div class="historial-header">
                <h3>📋 Últimos registros</h3>
                <span class="historial-info" id="infoRetencion">Guarda 3 meses</span>
            </div>
            <div class="historial-lista" id="historialLista">
                <div class="vacio">Aún no hay registros</div>
            </div>
        </div>

    </div>

    <div class="footer">
        Sistema de Asistencia · Datos guardados 90 días
    </div>

</div>

<script>
// ============================================================
// CONFIGURACIÓN
// ============================================================
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyX1EK2U9WpxPHuDYZigJXWgSo31V2txxVl5Xd3t6XqC6J3W0xuxWugo8MHF0Dly_JaKw/exec";

// Retención de historial: 90 días (3 meses)
const DIAS_RETENCION = 90;
const MAX_REGISTROS = 800; // Límite de seguridad

let lector = null;
let procesando = false;
let camaraActiva = false;
let historial = [];
let contadorHoy = 0;

// ============================================================
// INICIALIZACIÓN - Cargar y limpiar datos antiguos
// ============================================================
function inicializarDatos() {
    try {
        // Cargar historial
        const guardado = localStorage.getItem('historialAsistencia');
        if (guardado) {
            historial = JSON.parse(guardado);
        }

        // Limpiar registros más antiguos de 90 días
        const limiteMs = DIAS_RETENCION * 24 * 60 * 60 * 1000;
        const ahora = Date.now();
        const antes = historial.length;

        historial = historial.filter(item => {
            return item.ts && (ahora - item.ts) < limiteMs;
        });

        // Limitar cantidad máxima por seguridad
        if (historial.length > MAX_REGISTROS) {
            historial = historial.slice(0, MAX_REGISTROS);
        }

        // Guardar si se eliminó algo
        if (historial.length !== antes) {
            localStorage.setItem('historialAsistencia', JSON.stringify(historial));
        }

        actualizarHistorialUI();

        // Contador del día
        const cont = localStorage.getItem('contadorHoy');
        const fecha = localStorage.getItem('fechaContador');
        const hoy = new Date().toDateString();

        if (fecha === hoy && cont) {
            contadorHoy = parseInt(cont) || 0;
        } else {
            contadorHoy = 0;
            localStorage.setItem('fechaContador', hoy);
            localStorage.setItem('contadorHoy', '0');
        }

        document.getElementById('contadorHoy').textContent = `Hoy: ${contadorHoy}`;

        // Mostrar info de retención
        const total = historial.length;
        document.getElementById('infoRetencion').textContent = 
            total > 0 ? `${total} registros · 90 días` : 'Guarda 3 meses';

    } catch (e) {
        console.error('Error al cargar datos:', e);
        historial = [];
    }
}

// Ejecutar al cargar
inicializarDatos();

// ============================================================
// CÁMARA
// ============================================================
async function iniciarCamara() {
    const boton = document.getElementById("botonCamara");
    const botonDetener = document.getElementById("botonDetener");

    boton.disabled = true;
    boton.innerHTML = "⏳ ACTIVANDO...";

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
        });
        stream.getTracks().forEach(t => t.stop());

        lector = new Html5Qrcode("reader");

        await lector.start(
            { facingMode: "environment" },
            {
                fps: 12,
                qrbox: { width: 240, height: 240 },
                aspectRatio: 1.0
            },
            (codigo) => procesarQR(codigo),
            () => {}
        );

        camaraActiva = true;
        boton.innerHTML = "🟢 CÁMARA ACTIVA";
        botonDetener.classList.add("visible");

        mostrarMensaje("AVISO", "ESCANEE EL CÓDIGO QR", "", "");

    } catch (err) {
        console.error(err);
        boton.disabled = false;
        boton.innerHTML = "📷 ACTIVAR CÁMARA";
        mostrarMensaje("ERROR", "NO SE PUDO ACTIVAR LA CÁMARA", "", "");
        hablar("No se pudo activar la cámara");
    }
}

async function detenerCamara() {
    if (lector && camaraActiva) {
        try {
            await lector.stop();
            lector.clear();
        } catch (e) {}
        camaraActiva = false;
        lector = null;
    }

    document.getElementById("botonCamara").disabled = false;
    document.getElementById("botonCamara").innerHTML = "📷 ACTIVAR CÁMARA";
    document.getElementById("botonDetener").classList.remove("visible");
    document.getElementById("reader").innerHTML = "";

    mostrarMensaje("AVISO", "CÁMARA DETENIDA", "", "");
}

// ============================================================
// PROCESAR QR / MANUAL
// ============================================================
function procesarQR(codigo) {
    if (procesando) return;

    const ci = String(codigo).trim();
    if (!ci) return;

    procesando = true;

    if (lector && camaraActiva) {
        lector.pause(true);
    }

    mostrarMensaje("AVISO", "🔎 VERIFICANDO...", "", "");
    enviarCI(ci);
}

function enviarManual() {
    const input = document.getElementById("inputCI");
    const ci = input.value.trim();

    if (!ci) {
        mostrarMensaje("ERROR", "INGRESE UN NÚMERO DE C.I.", "", "");
        return;
    }

    if (procesando) return;

    procesando = true;
    input.value = "";
    mostrarMensaje("AVISO", "🔎 VERIFICANDO...", "", "");
    enviarCI(ci);
}

document.getElementById("inputCI").addEventListener("keydown", (e) => {
    if (e.key === "Enter") enviarManual();
});

// ============================================================
// ENVIAR A APPS SCRIPT (JSONP)
// ============================================================
function enviarCI(ci) {
    const callbackName = "respuestaQR_" + Date.now();

    window[callbackName] = function(respuesta) {
        try {
            mostrarResultado(respuesta, ci);
        } finally {
            delete window[callbackName];
            setTimeout(() => {
                procesando = false;
                if (lector && camaraActiva) {
                    lector.resume();
                }
            }, 2800);
        }
    };

    const script = document.createElement("script");
    script.src = URL_APPS_SCRIPT +
        "?ci=" + encodeURIComponent(ci) +
        "&callback=" + callbackName;

    script.onerror = function() {
        mostrarMensaje("ERROR", "❌ ERROR DE CONEXIÓN", "", "");
        hablar("Error de conexión con el sistema");
        delete window[callbackName];
        setTimeout(() => {
            procesando = false;
            if (lector && camaraActiva) lector.resume();
        }, 2800);
    };

    document.body.appendChild(script);
}

// ============================================================
// RESULTADOS
// ============================================================
function mostrarResultado(respuesta, ci) {
    if (!respuesta) {
        mostrarMensaje("ERROR", "SIN RESPUESTA DEL SISTEMA", "", "");
        hablar("Sin respuesta del sistema");
        return;
    }

    if (respuesta.estado === "OK") {
        mostrarMensaje("OK", "✅ ASISTENCIA REGISTRADA", respuesta.nombre, respuesta.hora);
        hablar("Asistencia registrada. " + (respuesta.nombre || ""));
        vibrar(true);
        agregarHistorial(respuesta.nombre || ci, respuesta.hora || "", "ok");
        incrementarContador();
        return;
    }

    if (respuesta.estado === "YA") {
        mostrarMensaje("AVISO", "⚠️ YA REGISTRADA HOY", respuesta.nombre, "");
        hablar("Asistencia ya registrada. " + (respuesta.nombre || ""));
        vibrar(false);
        agregarHistorial(respuesta.nombre || ci, "Ya registrada", "ya");
        return;
    }

    if (respuesta.estado === "FUERA") {
        mostrarMensaje("AVISO", "⏰ FUERA DEL HORARIO", respuesta.nombre, "");
        hablar("Fuera del horario. " + (respuesta.nombre || ""));
        return;
    }

    const msg = respuesta.mensaje || "ERROR DESCONOCIDO";
    mostrarMensaje("ERROR", "❌ " + msg, "", "");
    hablar(msg);
}

function mostrarMensaje(tipo, mensaje, nombre, hora) {
    const el = document.getElementById("resultado");
    el.className = "";
    el.classList.add(tipo === "OK" ? "ok" : tipo === "ERROR" ? "error" : "aviso");

    let html = `<div class="estado">${mensaje}</div>`;
    if (nombre) html += `<div class="nombre">${nombre}</div>`;
    if (hora) html += `<div class="hora">🕐 ${hora}</div>`;

    el.innerHTML = html;
}

// ============================================================
// HISTORIAL (con retención de 90 días)
// ============================================================
function agregarHistorial(nombre, hora, tipo) {
    const ahora = Date.now();

    historial.unshift({
        nombre: nombre,
        hora: hora,
        tipo: tipo,
        ts: ahora
    });

    // Limpiar registros antiguos (> 90 días)
    const limiteMs = DIAS_RETENCION * 24 * 60 * 60 * 1000;
    historial = historial.filter(item => (ahora - item.ts) < limiteMs);

    // Limitar cantidad máxima
    if (historial.length > MAX_REGISTROS) {
        historial = historial.slice(0, MAX_REGISTROS);
    }

    try {
        localStorage.setItem('historialAsistencia', JSON.stringify(historial));
    } catch (e) {
        // Si se llena el almacenamiento, eliminar los más antiguos
        historial = historial.slice(0, Math.floor(historial.length * 0.7));
        try {
            localStorage.setItem('historialAsistencia', JSON.stringify(historial));
        } catch (e2) {}
    }

    actualizarHistorialUI();
}

function actualizarHistorialUI() {
    const lista = document.getElementById("historialLista");
    const info = document.getElementById("infoRetencion");

    if (historial.length === 0) {
        lista.innerHTML = '<div class="vacio">Aún no hay registros</div>';
        info.textContent = 'Guarda 3 meses';
        return;
    }

    // Mostrar los últimos 25 en pantalla (el resto queda guardado)
    const mostrar = historial.slice(0, 25);

    lista.innerHTML = mostrar.map(item => {
        const fecha = new Date(item.ts);
        const esHoy = fecha.toDateString() === new Date().toDateString();
        const textoHora = esHoy 
            ? item.hora 
            : fecha.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' }) + ' ' + (item.hora || '');

        return `
            <div class="item-historial ${item.tipo === 'ok' ? 'ok-hist' : 'ya-hist'}">
                <span class="nombre-hist">${item.nombre}</span>
                <span class="hora-hist">${textoHora}</span>
            </div>
        `;
    }).join('');

    info.textContent = `${historial.length} registros · 90 días`;
}

function incrementarContador() {
    contadorHoy++;
    document.getElementById('contadorHoy').textContent = `Hoy: ${contadorHoy}`;
    try {
        localStorage.setItem('contadorHoy', contadorHoy.toString());
        localStorage.setItem('fechaContador', new Date().toDateString());
    } catch (e) {}
}

// ============================================================
// UTILIDADES
// ============================================================
function hablar(texto) {
    try {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const voz = new SpeechSynthesisUtterance(texto);
        voz.lang = "es-ES";
        voz.rate = 0.95;
        voz.pitch = 1;
        window.speechSynthesis.speak(voz);
    } catch (e) {}
}

function vibrar(exito) {
    if ("vibrate" in navigator) {
        navigator.vibrate(exito ? [80, 40, 80] : [150]);
    }
}
</script>

</body>
</html>
